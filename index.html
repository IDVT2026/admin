<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volleyball Tournament Admin</title>
  <title>Tournament Live Score</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    .external-fullscreen {
        position: fixed;
        top: 0px;
        right: 0px;
        background: rgb(0 0 0 / 0%);
        backdrop-filter: blur(4px);
        color: rgb(0 0 0 / 58%);
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        font-size: 12px;
        cursor: pointer;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    html, body { width: 100%; height: 100%; overflow: hidden; }
    body {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: Inter, Segoe UI, Arial, sans-serif;
      background: #153e35; color: #fff; gap: 16px;
    }
    .external-fullscreen:hover { background: #007bff; transform: scale(1.05); }
    /* Temporary overlay to capture first click on iframe area */
    .click-capture-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 10000;
      cursor: pointer;
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-icon {
      width: 56px; height: 56px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logo-icon img { width: 36px; height: 36px; object-fit: contain; }
    .logo-text {
      font-size: 18px; font-weight: 700;
      color: #fff; text-align: center;
      letter-spacing: 0.5px; line-height: 1.3;
    }
    .logo-sub {
      font-size: 13px; opacity: 0.6;
      text-align: center;
    }
    p { font-size: 16px; opacity: 0.8; }
    #iframeWrapper {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
    }
    #launcherIframe {
      position: absolute; top: 0; left: 0;
      display: block; border: none;
      transform-origin: top left;
    }
  </style>
</head>
<body>
  <iframe id="launcherIframe" 
    src=""
    referrerpolicy="no-referrer"
    allowfullscreen
    allow="fullscreen">
  </iframe>
  <button id="externalFullscreenBtn" class="external-fullscreen" title="Full screen">⤢</button>
  <!-- Temporary overlay for first click -->
  <div id="firstClickOverlay" class="click-capture-overlay"></div>

<body id="loadingScreen">
  <div id="loadingContent">
    <div class="logo-icon"><img src="LOGO_BASE64_HERE" alt="Tournament Logo"></div>
    <div class="logo-text">Interdepartmental<br>Volleyball Tournament</div>
    <div class="logo-sub">2026</div>
    <div class="spinner"></div>
    <p>Loading Tournament Live Score...</p>
  </div>
  <div id="iframeWrapper" style="display:none;">
    <iframe id="launcherIframe" referrerpolicy="no-referrer" allowfullscreen allow="fullscreen"></iframe>
  </div>
  <script>
    const baseUrl = 'https://script.google.com/macros/s/AKfycbzLPZpRtHGBJZhGVKuQPCxQYx5K0uxmgd-RcHqnsoOFUvz-oCQvt1qSNythOfJWy8Y/exec';
    var BASE_URL = 'https://script.google.com/macros/s/AKfycbw9lx36PEvVOCDUgzYLcQ6JBa527EF2emEolVhXn8D08RZWAi70fprFgHc-GVFlRzKO/exec?mode=admin';

    var iframe = document.getElementById('launcherIframe');
    var loading = document.getElementById('loadingContent');
    var wrapper = document.getElementById('iframeWrapper');

    const btn = document.getElementById('externalFullscreenBtn');
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(console.warn);
    /*
     * Mobile browsers assign ~980px layout viewport to cross-origin iframes.
     * We render the iframe at 980px (the width the browser will assign)
     * then scale it down proportionally to fit the actual screen width.
     * This ensures the content fills the screen without overflowing.
     */
    function sizeIframe() {
      var vw = window.innerWidth;
      var vh = window.innerHeight;
      var DESKTOP_WIDTH = 980;

      wrapper.style.width = vw + 'px';
      wrapper.style.height = vh + 'px';

      if (vw < DESKTOP_WIDTH) {
        var scale = vw / DESKTOP_WIDTH;
        iframe.style.width = DESKTOP_WIDTH + 'px';
        iframe.style.height = (vh / scale) + 'px';
        iframe.style.transform = 'scale(' + scale + ')';
      } else {
        document.exitFullscreen();
        iframe.style.width = vw + 'px';
        iframe.style.height = vh + 'px';
        iframe.style.transform = '';
      }
    }
    btn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      btn.textContent = document.fullscreenElement ? '✕' : '⤢';
      btn.title = document.fullscreenElement ? 'Exit full screen' : 'Full screen';
    function showIframe() {
      loading.style.display = 'none';
      wrapper.style.display = 'block';
      iframe.src = BASE_URL;
    }

    // Pre-size while loading screen is visible
    sizeIframe();
    // Show iframe after 1.5 seconds
    setTimeout(showIframe, 1500);

    iframe.addEventListener('load', function() {
      if (loading.style.display !== 'none') {
        loading.style.display = 'none';
        wrapper.style.display = 'block';
      }
    });

    // --- First click anywhere (captured by overlay) ---
    const overlay = document.getElementById('firstClickOverlay');
    overlay.addEventListener('click', function onFirstClick() {
      // Remove overlay immediately
      overlay.removeEventListener('click', onFirstClick);
      overlay.remove();
      // Enter full‑screen
      document.documentElement.requestFullscreen().catch(console.warn);
    var lastVw = window.innerWidth;
    var lastVh = window.innerHeight;
    var resizeTimer;

    window.addEventListener('resize', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        var nvw = window.innerWidth;
        var nvh = window.innerHeight;
        if (nvw !== lastVw || nvh !== lastVh) {
          lastVw = nvw;
          lastVh = nvh;
          sizeIframe();
        }
      }, 250);
    });
    // Also for touch devices
    overlay.addEventListener('touchstart', function onFirstTouch() {
      overlay.removeEventListener('touchstart', onFirstTouch);
      overlay.remove();
      document.documentElement.requestFullscreen().catch(console.warn);
    window.addEventListener('orientationchange', function() {
      setTimeout(function() {
        var nvw = window.innerWidth;
        var nvh = window.innerHeight;
        if (nvw !== lastVw || nvh !== lastVh) {
          lastVw = nvw;
          lastVh = nvh;
          sizeIframe();
        }
      }, 400);
    });
  </script>
</body>
