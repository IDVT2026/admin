<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Volleyball Tournament Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
    .external-fullscreen {
        position: fixed;
        top: 0px;
        right: 0px;
        background: rgb(0 0 0 / 0%);
        backdrop-filter: blur(4px);
        color: rgb(0 0 0 / 58%);
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        font-size: 12px;
        cursor: pointer;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
    }
    .external-fullscreen:hover { background: #007bff; transform: scale(1.05); }
    /* Temporary overlay to capture first click on iframe area */
    .click-capture-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      z-index: 10000;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <iframe id="launcherIframe" 
    src=""
    referrerpolicy="no-referrer"
    allowfullscreen
    allow="fullscreen">
  </iframe>
  <button id="externalFullscreenBtn" class="external-fullscreen" title="Full screen">⤢</button>
  <!-- Temporary overlay for first click -->
  <div id="firstClickOverlay" class="click-capture-overlay"></div>
</body>
</html>
